<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='860' viewBox='0 0 1400 860' font-family='Segoe UI, Arial, sans-serif'><defs><marker id='tri' viewBox='0 0 12 12' refX='11' refY='6' markerWidth='14' markerHeight='14' orient='auto'><path d='M1 1 L11 6 L1 11 Z' fill='white' stroke='#5b6675' stroke-width='1.3'/></marker><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='9' markerHeight='9' orient='auto'><path d='M1 1 L9 5 L1 9' fill='none' stroke='#5b6675' stroke-width='1.4'/></marker><marker id='arrf' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='8' markerHeight='8' orient='auto'><path d='M0 0 L10 5 L0 10 Z' fill='#5b6675'/></marker></defs><rect width='100%' height='100%' fill='white'/><rect x='30' y='20' width='1340' height='150' rx='12' fill='#f2f8fe'/><text x='50' y='46' font-size='15' font-weight='700' text-anchor='start' fill='#0a59a9'>1. Presentation layer (client)</text><rect x='420' y='55' width='560' height='100' rx='9' fill='white' stroke='#0d9cf8' stroke-width='1.6'/><text x='700' y='79' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>Web browser (desktop &amp; mobile)</text><text x='700' y='101' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>HTML5 + CSS3 + vanilla JavaScript, Arabic RTL / English LTR</text><text x='700' y='119' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Catalog, cart, checkout, tracking, advisor, back-office screens</text><rect x='30' y='195' width='1340' height='150' rx='12' fill='#f6f7fb'/><text x='50' y='221' font-size='15' font-weight='700' text-anchor='start' fill='#0a59a9'>2. Edge / web server</text><rect x='420' y='230' width='560' height='100' rx='9' fill='white' stroke='#0d9cf8' stroke-width='1.6'/><text x='700' y='254' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>nginx reverse proxy</text><text x='700' y='276' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>HTTPS (TLS 1.2+), HSTS, security headers, CSP</text><text x='700' y='294' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Rate limiting, static files and images + gzip, /api → application</text><rect x='30' y='370' width='1340' height='220' rx='12' fill='#f2f8fe'/><text x='50' y='396' font-size='15' font-weight='700' text-anchor='start' fill='#0a59a9'>3. Application layer (REST API)</text><rect x='80' y='405' width='380' height='165' rx='9' fill='white' stroke='#0d9cf8' stroke-width='1.6'/><text x='270' y='429' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>Routers (FastAPI)</text><text x='270' y='451' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>/auth  /products  /cart  /wishlist</text><text x='270' y='469' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>/orders  /me  /admin/*</text><text x='270' y='487' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Validation (Pydantic), CSRF check,</text><text x='270' y='505' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>role check (RBAC)</text><rect x='510' y='405' width='380' height='165' rx='9' fill='white' stroke='#0d9cf8' stroke-width='1.6'/><text x='700' y='429' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>Services (business rules)</text><text x='700' y='451' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>AuthService (Argon2id, sessions)</text><text x='700' y='469' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>CatalogService, CartService</text><text x='700' y='487' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>OrderService (stock check, BR-01..04)</text><text x='700' y='505' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>ReportService, ReviewService</text><rect x='940' y='405' width='380' height='165' rx='9' fill='white' stroke='#0d9cf8' stroke-width='1.6'/><text x='1130' y='429' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>Repositories + jobs</text><text x='1130' y='451' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>SQL data access (SQLAlchemy)</text><text x='1130' y='469' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>ERP sync worker (every 5 min)</text><text x='1130' y='487' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Notification worker (WhatsApp)</text><text x='1130' y='505' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Audit logging</text><rect x='30' y='615' width='1340' height='225' rx='12' fill='#f6f7fb'/><text x='50' y='641' font-size='15' font-weight='700' text-anchor='start' fill='#0a59a9'>4. Data and external systems</text><rect x='80' y='665' width='380' height='140' rx='9' fill='#fbfdff' stroke='#0d9cf8' stroke-width='1.6'/><text x='270' y='689' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>PostgreSQL 16</text><text x='270' y='711' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>15 tables (section 6)</text><text x='270' y='729' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Daily backups, 1-hour restore</text><text x='270' y='747' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Full-text search index</text><rect x='510' y='665' width='380' height='140' rx='9' fill='#fbfdff' stroke='#0d9cf8' stroke-width='1.6'/><text x='700' y='689' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>Media storage</text><text x='700' y='711' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Product images (WebP)</text><text x='700' y='729' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Served by nginx with caching</text><rect x='940' y='665' width='175' height='140' rx='9' fill='#fbfdff' stroke='#0d9cf8' stroke-width='1.6'/><text x='1027.5' y='689' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>ERP (Odoo)</text><text x='1027.5' y='711' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Products, prices,</text><text x='1027.5' y='729' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>stock, orders</text><text x='1027.5' y='747' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>API key on server</text><rect x='1145' y='665' width='175' height='140' rx='9' fill='#fbfdff' stroke='#0d9cf8' stroke-width='1.6'/><text x='1232.5' y='689' font-size='14' font-weight='700' text-anchor='middle' fill='#1b2430'>WhatsApp API</text><text x='1232.5' y='711' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>Order summaries</text><text x='1232.5' y='729' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>to customers</text><text x='1232.5' y='747' font-size='12' font-weight='400' text-anchor='middle' fill='#3c4652'>token on server</text><path d='M700 155 V230' fill='none' stroke='#5b6675' stroke-width='1.8'  marker-end='url(#arrf)'/><text x='712' y='196' font-size='12' font-weight='600' text-anchor='start' fill='#5b6675'>HTTPS / JSON</text><path d='M560 330 V385 H390 V405' fill='none' stroke='#5b6675' stroke-width='1.8'  marker-end='url(#arrf)'/><text x='578' y='362' font-size='12' font-weight='600' text-anchor='start' fill='#5b6675'>proxy /api/v1</text><path d='M460 488 H510' fill='none' stroke='#5b6675' stroke-width='1.8'  marker-end='url(#arrf)'/><path d='M890 488 H940' fill='none' stroke='#5b6675' stroke-width='1.8'  marker-end='url(#arrf)'/><path d='M1000 570 V630 H270 V665' fill='none' stroke='#5b6675' stroke-width='1.8'  marker-end='url(#arrf)'/><text x='620' y='623' font-size='12' font-weight='600' text-anchor='start' fill='#5b6675'>SQL</text><path d='M1027 570 V665' fill='none' stroke='#5b6675' stroke-width='1.8' stroke-dasharray='7 5' marker-end='url(#arrf)'/><text x='1035' y='600' font-size='12' font-weight='600' text-anchor='start' fill='#5b6675'>XML-RPC</text><path d='M1232 570 V665' fill='none' stroke='#5b6675' stroke-width='1.8' stroke-dasharray='7 5' marker-end='url(#arrf)'/><text x='1240' y='600' font-size='12' font-weight='600' text-anchor='start' fill='#5b6675'>HTTPS</text></svg>